<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Афиша на печать — Театр RAT</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link href="fonts/fonts.css?v=20260912a" rel="stylesheet">
<style>
  @page{size:A4;margin:10mm}
  *{box-sizing:border-box}
  body{margin:0;background:#2a2a2a;font-family:"PT Mono","PT Mono Fallback",ui-monospace,monospace;color:#0a0a0a}
  .bar{position:sticky;top:0;z-index:5;background:#0a0a0a;color:#eee;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px}
  .bar button,.bar a{font-family:"Oswald","Oswald Fallback",sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:8px 14px;border:2px solid #c9ff3d;background:#c9ff3d;color:#000;cursor:pointer;text-decoration:none;font-size:13px}
  .bar a{background:transparent;color:#eee;border-color:#444}
  .bar label{display:flex;align-items:center;gap:6px}
  .bar input[type=number]{width:56px;padding:4px 6px;font:inherit;background:#111;color:#eee;border:1px solid #444}
  .sheet{width:190mm;height:277mm;margin:16px auto;background:#f1eee4;padding:12mm 12mm 10mm;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.6);overflow:hidden}
  .top{display:flex;justify-content:space-between;align-items:center}
  .stamp{border:2.5px solid #000;padding:5px 10px;font-family:"Oswald","Oswald Fallback",sans-serif;font-weight:700;font-size:12pt;letter-spacing:.12em;text-transform:uppercase;transform:rotate(-2deg);display:inline-flex;gap:8px;align-items:center}
  .stamp svg{width:22px;height:22px}
  .site{font-family:"Oswald","Oswald Fallback",sans-serif;font-weight:600;font-size:11pt;letter-spacing:.08em;background:#c9ff3d;padding:3px 8px;transform:rotate(1.5deg)}
  h1{margin:8mm 0 0;font-family:"Oswald","Oswald Fallback",Impact,sans-serif;font-weight:700;font-size:54pt;line-height:.86;text-transform:uppercase;letter-spacing:-.01em}
  h1 em{font-style:normal;font-family:"Rubik Spray Paint","Spray Fallback",Impact,sans-serif;font-weight:400;color:#7a9a00;display:inline-block;transform:rotate(-2deg)}
  .sub{margin:3mm 0 0;font-size:9.5pt;color:#5a574f}
  .band{margin:6mm -14mm 4mm;background:#c9ff3d;border-top:2.5px solid #000;border-bottom:2.5px solid #000;transform:rotate(-1.2deg);padding:5px 0;white-space:nowrap;overflow:hidden;font-family:"Oswald","Oswald Fallback",sans-serif;font-weight:700;font-size:12pt;letter-spacing:.1em;text-transform:uppercase}
  .list{margin-top:5mm}
  .ev{display:grid;grid-template-columns:22mm 1fr auto;gap:0 6mm;align-items:center;padding:3.2mm 0;border-bottom:1.5px dashed #999}
  .ev:last-child{border-bottom:0}
  .ev .d b{display:block;font-family:"Rubik Spray Paint","Spray Fallback",Impact,sans-serif;font-weight:400;font-size:26pt;line-height:.9;color:#ff3b2f}
  .ev .d span{display:block;font-family:"Oswald","Oswald Fallback",sans-serif;font-size:9pt;text-transform:uppercase;letter-spacing:.1em}
  .ev .t{font-family:"Oswald","Oswald Fallback",sans-serif;font-weight:700;font-size:16pt;text-transform:uppercase;line-height:1}
  .ev .m{font-size:8.5pt;color:#5a574f;margin-top:1.5mm}
  .ev .p{font-family:"Oswald","Oswald Fallback",sans-serif;font-weight:600;font-size:11pt;white-space:nowrap}
  .ev .badge{display:inline-block;background:#000;color:#c9ff3d;font-family:"Oswald","Oswald Fallback",sans-serif;font-size:7.5pt;letter-spacing:.08em;text-transform:uppercase;padding:1px 5px;margin-left:5px;transform:rotate(-2deg);vertical-align:middle}
  .empty{padding:10mm;text-align:center;color:#5a574f}
  .foot{position:absolute;left:12mm;right:12mm;bottom:10mm;display:grid;grid-template-columns:34mm 1fr;gap:6mm;align-items:center;border-top:2.5px solid #000;padding-top:5mm;background:#f1eee4}
  .qr{width:34mm;height:34mm;background:#fff;border:2px solid #000;padding:2mm}
  .qr img,.qr canvas{width:100%;height:100%;display:block}
  .foot .big{font-family:"Oswald","Oswald Fallback",sans-serif;font-weight:700;font-size:14pt;text-transform:uppercase;line-height:1.05}
  .foot .small{font-size:8.5pt;color:#5a574f;margin-top:2mm}
  .foot .url{font-family:"Oswald","Oswald Fallback",sans-serif;font-weight:700;font-size:12pt;letter-spacing:.06em;background:#000;color:#c9ff3d;display:inline-block;padding:2px 8px;margin-top:3mm;transform:rotate(-1deg)}
  @media print{body{background:#fff}.bar{display:none}.sheet{margin:0;box-shadow:none;width:auto;height:277mm}}
</style>
</head>
<body>
<div class="bar">
  <button onclick="window.print()">Печать / сохранить PDF</button>
  <label>Показов: <input type="number" id="n" min="1" max="12" value="8"></label>
  <a href="admin">← в админку</a>
  <span style="color:#8f8b80">Лист А4. Даты, цены и стикеры берутся с сайта, QR ведёт на главную.</span>
</div>

<div class="sheet" id="sheet">
  <div class="top"><span class="stamp"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="31" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="20" cy="20" r="7" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="44" cy="20" r="7" fill="none" stroke="currentColor" stroke-width="3"/><path d="M18 26c2 10 8 18 14 20 6-2 12-10 14-20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="32" cy="41" r="2.5" fill="currentColor"/></svg><span id="thName">Театр RAT</span></span><span class="site" id="siteHost">rat-theater.rf.gd</span></div>
  <h1>Афи<em>ша</em></h1>
  <p class="sub" id="tagline"></p>
  <div class="band" id="band"></div>
  <div class="list" id="list"></div>
  <div class="foot">
    <div class="qr" id="qr"></div>
    <div><div class="big">Билеты и подробности на сайте</div><div class="small" id="venue"></div><div class="url" id="url"></div></div>
  </div>
</div>

<script src="vendor/qrcode.min.js"></script>
<script src="assets/site.js?v=20260912a"></script>
<script>
var R = window.RAT, esc = R.esc, DATA = null;
function draw() {
  var d = DATA, th = d.theatre, map = R.byId(d), n = Math.max(1, Math.min(12, +document.getElementById("n").value || 8));
  var events = R.upcoming(d).slice(0, n);
  document.getElementById("thName").textContent = th.name || "Театр RAT";
  document.getElementById("tagline").textContent = th.tagline || "";
  var host = location.host || "rat-theater.rf.gd", base = R.siteUrl();
  document.getElementById("siteHost").textContent = host; document.getElementById("url").textContent = host;
  document.getElementById("venue").textContent = [th.venue, th.address].filter(Boolean).join(" · ");
  var items = ["Афиша", th.name || "Театр RAT", "Билеты", "Голосуй рублём"]; var band = ""; for (var k = 0; k < 6; k++) items.forEach(function (t) { band += t + " ✦ "; });
  document.getElementById("band").textContent = band;
  document.getElementById("list").innerHTML = events.length ? events.map(function (e) {
    var p = map[e.playId], dt = R.parseDate(e.date), M = ["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"], D = ["вс","пн","вт","ср","чт","пт","сб"];
    var badges = (e.badges || []).filter(function (b) { return R.BADGES[b]; }).map(function (b) { return '<span class="badge">' + R.BADGES[b] + "</span>"; }).join("");
    return '<div class="ev"><div class="d"><b>' + dt.getDate() + "</b><span>" + M[dt.getMonth()] + " · " + D[dt.getDay()] + "</span></div>" +
      '<div><div class="t">' + esc(p ? p.title : (e.note || "Спектакль")) + badges + '</div><div class="m">' + esc(e.time || "") + " · " + esc(e.venue || th.venue || "") + (p && p.duration ? " · " + esc(p.duration) : "") + (p && p.age ? " · " + esc(p.age) : "") + "</div></div>" +
      '<div class="p">' + esc(e.price || "") + "</div></div>";
  }).join("") : '<div class="empty">Ближайшие даты скоро объявим</div>';
  var qr = document.getElementById("qr"); qr.innerHTML = "";
  if (window.QRCode) new QRCode(qr, { text: base + "/", width: 260, height: 260, correctLevel: QRCode.CorrectLevel.M });
}
R.loadData({}).then(function (d) { DATA = d; draw(); });
document.getElementById("n").oninput = draw;
</script>
</body>
</html>
